name = "milkyway-project"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
# process.env remains supported for Node hosts; Pages bindings are passed from context.env to API handlers.
# node:crypto and Buffer are provided by nodejs_compat.
compatibility_flags = ["nodejs_compat"]

# The production Pages project is milkyway-project.pages.dev; www.masiyatunda.com is
# attached to that project as the canonical custom domain in Cloudflare Pages.
# Configure the Pages build command in Cloudflare Dashboard: npm run build
# Set VITE_SUPABASE_URL in the Pages build environment to this same HTTPS Supabase origin.
# Set credentials as Pages secrets, never as vars in this file:
#   wrangler pages secret put LIVEKIT_API_KEY --project-name milkyway-project
#   wrangler pages secret put LIVEKIT_API_SECRET --project-name milkyway-project
#   wrangler pages secret put SUPABASE_ANON_KEY --project-name milkyway-project
[vars]
LIVEKIT_URL = "wss://masiyatunda-milkyway-live-mgh6b1np.livekit.cloud"
SUPABASE_URL = "https://wpclkhgizbvxuvbhbwzs.supabase.co"
VITE_SUPABASE_URL = "https://wpclkhgizbvxuvbhbwzs.supabase.co"
